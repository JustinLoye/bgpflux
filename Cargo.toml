[package]
name = "bgpflux"
version = "0.3.0"
edition = "2021"
authors = ["Justin Loye"]
description = "A Rust library and CLI for streaming ordered BGP elements from multiple collectors"
license = "MIT"
repository = "https://github.com/JustinLoye/bgpflux"
homepage = "https://github.com/JustinLoye/bgpflux"
keywords = ["bgp", "routing", "bgpkit", "bgpstream"]
categories = ["network-programming"]
readme = "README.md"

[features]
default = []
live = ["live-ris", "live-routeviews"]
live-ris = ["dep:tungstenite", "dep:serde_json", "bgpkit-parser/rislive"]
live-routeviews = ["dep:kafka", "dep:bytes"]

[dependencies]
bgpkit-broker = "0.10.1"
bgpkit-parser = "0.16"
tungstenite = { version = "0.29.0", optional = true }
chrono = "0.4.43"
itertools = "0.14.0"
serde = { version = "1.0", features = ["derive"], optional = true }
regex = "1.12.3"
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
ipnet = "2.12.0"
serde_json = { version = "1.0.149", optional = true }
kafka = { version = "0.10.0", optional = true }
bytes = { version = "1.7", optional = true }

[[example]]
name = "live_stream"
required-features = ["live"]